name: Pixelrises Continuous Product Lab

on:
  schedule:
    # Europe/Paris midnight is 22:00 UTC in summer and 23:00 UTC in winter.
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Product Lab mode to run"
        required: true
        default: "proposalOnly"
        type: choice
        options:
          - dryRun
          - proposalOnly
          - prMode
          - autoMergeControlled
      dryRun:
        description: "Analyze and generate reports without writing proposals to Supabase"
        required: true
        default: false
        type: boolean
      forceGenerate:
        description: "Force at least one safe diagnostic proposal when testing manually"
        required: true
        default: true
        type: boolean
      maxProposals:
        description: "Maximum proposals to display in the admin queue"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pixelrises-product-lab
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
  PIXELRISES_GENERATOR_REAL_QA: ${{ vars.PIXELRISES_GENERATOR_REAL_QA || '1' }}
  PIXELRISES_GENERATOR_DAILY_REAL_BUDGET: ${{ vars.PIXELRISES_GENERATOR_DAILY_REAL_BUDGET || '10' }}
  PRODUCT_LAB_MIN_REVIEW_ITEMS: "2"
  PRODUCT_LAB_MAX_REVIEW_ITEMS: "2"

jobs:
  product-lab:
    name: Daily Product Lab
    runs-on: ubuntu-latest
    environment: v2
    timeout-minutes: 45

    steps:
      - name: Decide Product Lab run window
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested."
            exit 0
          fi

          paris_hour="$(TZ=Europe/Paris date +%H)"
          if [ "$paris_hour" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running at midnight Europe/Paris."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because Europe/Paris hour is $paris_hour, not 00."
          fi

      - name: Explain safe skip
        if: steps.guard.outputs.run != 'true'
        run: |
          echo "Product Lab skipped safely because this scheduled run is outside midnight Europe/Paris."
          echo "Manual workflow_dispatch runs always execute the Product Lab."

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Resolve Product Lab mode
        id: run_mode
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            dry_run="${{ inputs.dryRun }}"
            force_generate="${{ inputs.forceGenerate }}"
            max_proposals="${{ inputs.maxProposals }}"
            source="workflow_dispatch"
          else
            mode="proposalOnly"
            dry_run="false"
            force_generate="true"
            max_proposals="${PRODUCT_LAB_MAX_REVIEW_ITEMS:-2}"
            source="scheduled"
          fi

          if [ "$mode" = "dryRun" ]; then
            dry_run="true"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "force_generate=$force_generate" >> "$GITHUB_OUTPUT"
          echo "max_proposals=$max_proposals" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Product Lab mode: $mode, dryRun=$dry_run, forceGenerate=$force_generate, maxProposals=$max_proposals, source=$source"

      - name: Pull admin-approved Product Lab decisions
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run product-lab:decisions:pull

      - name: Verify trusted Product Lab research sources
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        env:
          PRODUCT_LAB_RESEARCH_TIMEOUT_MS: "7000"
        run: npm run product-lab:research

      - name: Run Product Lab
        if: steps.guard.outputs.run == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          PRODUCT_LAB_MAX_PATCHES: "2"
          PRODUCT_LAB_APPLY_SAFE_FIXES: "true"
          PRODUCT_LAB_MODE: ${{ steps.run_mode.outputs.mode }}
          PRODUCT_LAB_DRY_RUN: ${{ steps.run_mode.outputs.dry_run }}
          PRODUCT_LAB_FORCE_GENERATE: ${{ steps.run_mode.outputs.force_generate }}
          PRODUCT_LAB_MAX_REVIEW_ITEMS: ${{ steps.run_mode.outputs.max_proposals }}
          PRODUCT_LAB_RUN_SOURCE: ${{ steps.run_mode.outputs.source }}
          PRODUCT_LAB_RUN_STARTED_AT: ${{ steps.run_mode.outputs.started_at }}
        shell: bash
        run: |
          npm run product-lab:daily -- --mode "${{ steps.run_mode.outputs.mode }}" --max-proposals "${{ steps.run_mode.outputs.max_proposals }}"

      - name: Check V2 generator smoke QA configuration
        id: smoke_preflight
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          PIXELRISES_SMOKE_BEARER_TOKEN: ${{ secrets.PIXELRISES_SMOKE_BEARER_TOKEN }}
          PIXELRISES_SMOKE_EMAIL: ${{ secrets.PIXELRISES_SMOKE_EMAIL }}
          PIXELRISES_SMOKE_PASSWORD: ${{ secrets.PIXELRISES_SMOKE_PASSWORD }}
        run: |
          enabled="${PIXELRISES_GENERATOR_REAL_QA:-1}"
          budget="${PIXELRISES_GENERATOR_DAILY_REAL_BUDGET:-10}"
          missing=()

          if [ "$enabled" = "1" ] && [ "${budget:-0}" != "0" ]; then
            if [ -z "$VITE_SUPABASE_URL" ]; then
              missing+=("VITE_SUPABASE_URL")
            fi
            if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
              missing+=("VITE_SUPABASE_PUBLISHABLE_KEY")
            fi
            if [ -z "$PIXELRISES_SMOKE_BEARER_TOKEN" ] && { [ -z "$PIXELRISES_SMOKE_EMAIL" ] || [ -z "$PIXELRISES_SMOKE_PASSWORD" ]; }; then
              missing+=("PIXELRISES_SMOKE_BEARER_TOKEN or PIXELRISES_SMOKE_EMAIL/PIXELRISES_SMOKE_PASSWORD")
            fi
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "budget=$budget" >> "$GITHUB_OUTPUT"

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=none" >> "$GITHUB_OUTPUT"
            echo "V2 smoke QA configuration is ready."
          else
            printf -v joined "%s, " "${missing[@]}"
            joined="${joined%, }"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "::warning title=V2 smoke QA configuration missing::$joined"
          fi

      - name: Run V2 generator smoke QA
        id: generator_smoke
        if: steps.guard.outputs.run == 'true' && steps.smoke_preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          PIXELRISES_SMOKE_BEARER_TOKEN: ${{ secrets.PIXELRISES_SMOKE_BEARER_TOKEN }}
          PIXELRISES_SMOKE_EMAIL: ${{ secrets.PIXELRISES_SMOKE_EMAIL }}
          PIXELRISES_SMOKE_PASSWORD: ${{ secrets.PIXELRISES_SMOKE_PASSWORD }}
          PIXELRISES_SMOKE_ONLY: ${{ vars.PIXELRISES_SMOKE_ONLY }}
        run: npm run smoke:generator

      - name: Check Product Lab admin sync configuration
        id: admin_sync_preflight
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()

          if [ -z "$VITE_SUPABASE_URL" ]; then
            missing+=("VITE_SUPABASE_URL")
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            missing+=("SUPABASE_SERVICE_ROLE_KEY")
          fi

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=none" >> "$GITHUB_OUTPUT"
            echo "Product Lab admin sync configuration is ready."
          else
            printf -v joined "%s, " "${missing[@]}"
            joined="${joined%, }"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "::error title=Product Lab admin sync configuration missing::$joined"
          fi

      - name: Push Product Lab proposals to Supabase
        id: proposals_push
        if: >
          always() &&
          steps.guard.outputs.run == 'true' &&
          steps.admin_sync_preflight.outputs.ready == 'true' &&
          steps.run_mode.outputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCT_LAB_REQUIRE_SUPABASE_SYNC: "true"
        run: npm run product-lab:proposals:push

      - name: Record Product Lab run status
        id: run_status_sync
        if: >
          always() &&
          steps.guard.outputs.run == 'true' &&
          steps.admin_sync_preflight.outputs.ready == 'true' &&
          steps.run_mode.outputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCT_LAB_MODE: ${{ steps.run_mode.outputs.mode }}
          PRODUCT_LAB_FORCE_GENERATE: ${{ steps.run_mode.outputs.force_generate }}
          PRODUCT_LAB_RUN_SOURCE: ${{ steps.run_mode.outputs.source }}
          PRODUCT_LAB_RUN_STARTED_AT: ${{ steps.run_mode.outputs.started_at }}
          PRODUCT_LAB_RUN_STATUS: completed
        run: npm run product-lab:run-status:record

      - name: Lint
        id: lint
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: npm run lint

      - name: Test
        id: test
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: npm run test

      - name: Build
        id: build
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: npm run build

      - name: Check Product Lab report redaction
        id: redaction
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: npm run product-lab:redaction:check

      - name: Check validation status
        id: validation
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          smoke_enabled="${{ steps.smoke_preflight.outputs.enabled }}"
          smoke_budget="${{ steps.smoke_preflight.outputs.budget }}"
          smoke_ready="${{ steps.smoke_preflight.outputs.ready }}"
          smoke_outcome="${{ steps.generator_smoke.outcome }}"

          smoke_passed=false
          if [ "$smoke_enabled" != "1" ] || [ "$smoke_budget" = "0" ]; then
            smoke_passed=true
          elif [ "$smoke_ready" = "true" ] && [ "$smoke_outcome" = "success" ]; then
            smoke_passed=true
          fi

          echo "smoke_passed=$smoke_passed" >> "$GITHUB_OUTPUT"

          proposal_sync_passed=false
          if [ "${{ steps.run_mode.outputs.dry_run }}" = "true" ]; then
            proposal_sync_passed=true
          elif [ "${{ steps.proposals_push.outcome }}" = "success" ] && [ "${{ steps.run_status_sync.outcome }}" = "success" ]; then
            proposal_sync_passed=true
          fi

          echo "proposal_sync_passed=$proposal_sync_passed" >> "$GITHUB_OUTPUT"

          if [ "$proposal_sync_passed" = "true" ] && [ "$smoke_passed" = "true" ] && [ "${{ steps.lint.outcome }}" = "success" ] && [ "${{ steps.test.outcome }}" = "success" ] && [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.redaction.outcome }}" = "success" ]; then
            echo "checks_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "checks_passed=false" >> "$GITHUB_OUTPUT"
            echo "At least one validation command failed. No Product Lab PR will be created."
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          if node -e "const fs=require('fs'); const p='product-lab/state/last-run-summary.json'; const s=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{}; process.exit((s.approvedFindings||[]).length > 0 && (s.appliedImprovements||[]).length > 0 ? 0 : 1)"; then
            echo "has_approved_improvements=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_approved_improvements=false" >> "$GITHUB_OUTPUT"
            echo "No admin-approved improvements were applied. No PR will be created."
          fi

      - name: Prepare Product Lab branch name
        id: branch
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          paris_date="$(TZ=Europe/Paris date +%F)"
          paris_day="$(TZ=Europe/Paris date +%u)"
          case "$paris_day" in
            1) theme="dashboard" ;;
            2) theme="site-builder" ;;
            3) theme="agent-builder" ;;
            4) theme="game-builder" ;;
            5) theme="multi-ai" ;;
            6) theme="templates-integrations" ;;
            *) theme="audit-roadmap" ;;
          esac
          echo "name=${paris_date}-${theme}" >> "$GITHUB_OUTPUT"

      - name: Evaluate controlled Product Lab auto-merge
        id: auto_merge_policy
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.validation.outputs.checks_passed == 'true' &&
          steps.validation.outputs.has_changes == 'true' &&
          steps.validation.outputs.has_approved_improvements == 'true'
        shell: bash
        env:
          PRODUCT_LAB_CHECKS_PASSED: ${{ steps.validation.outputs.checks_passed }}
        run: npm run product-lab:auto-merge:evaluate

      - name: Write validation failure report
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.validation.outputs.checks_passed == 'false'
        shell: bash
        run: |
          mkdir -p reports/product-lab/daily product-lab
          paris_date="$(TZ=Europe/Paris date +%F)"
          failure_report="reports/product-lab/daily/daily-${paris_date}-validation-failure.md"
          cat > "$failure_report" <<EOF
          # Pixelrises V2 - Product Lab Validation Failure

          ## Resume
          Le Product Lab a termine son run, mais la PR automatique est bloquee car une validation n'est pas verte.

          ## Tests lances
          - mode: ${{ steps.run_mode.outputs.mode }}
          - dry-run: ${{ steps.run_mode.outputs.dry_run }}
          - generator smoke QA: ${{ steps.generator_smoke.outcome }}
          - smoke QA preflight: ready=${{ steps.smoke_preflight.outputs.ready }}, missing=${{ steps.smoke_preflight.outputs.missing }}
          - Supabase proposals sync: ${{ steps.proposals_push.outcome }}
          - Product Lab run status sync: ${{ steps.run_status_sync.outcome }}
          - lint: ${{ steps.lint.outcome }}
          - test: ${{ steps.test.outcome }}
          - build: ${{ steps.build.outcome }}
          - redaction/secrets check: ${{ steps.redaction.outcome }}

          ## Resultat
          Aucune PR Product Lab ne sera creee tant que smoke QA, lint, tests, build et redaction ne sont pas verts.

          ## Priorite critique
          Corriger la validation bloquante avant toute PR Product Lab.
          EOF
          cat >> product-lab/backlog.md <<'EOF'

          ## Critique - Validation CI

          - **Corriger validation Product Lab en echec**
            - Module: CI / Product Lab
            - Impact: Eleve
            - Risque: Faible
            - Difficulte: A determiner
            - Priorite: Critique
            - Statut: A corriger
            - Source inspiration: Linear / Vercel
            - Decision: human_validation
          EOF

      - name: Upload Product Lab report
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: product-lab-report
          path: |
            reports/product-lab/daily/*.md
            reports/product-lab/weekly/*.md
            reports/product-lab/diagnostics/*.md
            tmp/generator-smoke-last.json
            product-lab/backlog.md
            product-lab/state/product-scores.json
            product-lab/state/last-run-summary.json
            product-lab/state/phase12-diagnostic.json
            product-lab/state/research-sources.json
            public/product-lab-review.json
          if-no-files-found: warn

      - name: Create Product Lab PR
        id: create-pr
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.validation.outputs.checks_passed == 'true' &&
          steps.validation.outputs.has_changes == 'true' &&
          steps.validation.outputs.has_approved_improvements == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: product-lab/${{ steps.branch.outputs.name }}
          title: "Product Lab: daily safe improvements"
          commit-message: "chore(product-lab): daily safe improvements"
          body: |
            ## Pixelrises Continuous Product Lab

            Improvements generated after admin approval in the Product Lab Review Center.

            - Lint: ${{ steps.lint.outcome }}
            - Tests: ${{ steps.test.outcome }}
            - Build: ${{ steps.build.outcome }}
            - Redaction/secrets check: ${{ steps.redaction.outcome }}
            - V2 smoke QA: ${{ steps.generator_smoke.outcome }}
            - Supabase proposals sync: ${{ steps.proposals_push.outcome }}
            - Admin-approved improvements applied: ${{ steps.validation.outputs.has_approved_improvements }}
            - Auto-merge policy: ${{ steps.auto_merge_policy.outputs.auto_merge_status }}
            - Risk level: ${{ steps.auto_merge_policy.outputs.risk_level }}

            Controlled auto-merge can be requested only after admin approval, green checks, no detected secrets, and no sensitive files.
            High-risk or sensitive changes remain manual-review only. No production deployment is triggered by this workflow.
          labels: product-lab, automation, admin-approved, risk-${{ steps.auto_merge_policy.outputs.risk_level }}

      - name: Request controlled Product Lab auto-merge
        id: auto_merge
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.create-pr.outcome == 'success' &&
          steps.auto_merge_policy.outputs.auto_merge_allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --squash --auto --delete-branch
          merged_at="$(gh pr view "${{ steps.create-pr.outputs.pull-request-number }}" --json mergedAt --jq '.mergedAt' 2>/dev/null || true)"
          if [ -n "$merged_at" ] && [ "$merged_at" != "null" ]; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            echo "status=auto_merge_requested" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Product Lab PR status
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.validation.outputs.checks_passed == 'true' &&
          steps.validation.outputs.has_approved_improvements == 'true' &&
          steps.create-pr.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCT_LAB_BRANCH: product-lab/${{ steps.branch.outputs.name }}
          PRODUCT_LAB_PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          PRODUCT_LAB_PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          PRODUCT_LAB_RISK_LEVEL: ${{ steps.auto_merge_policy.outputs.risk_level }}
          PRODUCT_LAB_TOUCHED_SENSITIVE_FILES: ${{ steps.auto_merge_policy.outputs.touched_sensitive_files }}
          PRODUCT_LAB_TEST_STATUS: passed
          PRODUCT_LAB_BUILD_STATUS: passed
        shell: bash
        run: |
          if [ "${{ steps.auto_merge_policy.outputs.auto_merge_allowed }}" = "true" ]; then
            if [ "${{ steps.auto_merge.outcome }}" = "success" ]; then
              export PRODUCT_LAB_AUTO_MERGE_STATUS="${{ steps.auto_merge.outputs.status || 'auto_merge_requested' }}"
              export PRODUCT_LAB_AUTO_MERGE_BLOCK_REASON=""
            else
              export PRODUCT_LAB_AUTO_MERGE_STATUS="auto_merge_request_failed"
              export PRODUCT_LAB_AUTO_MERGE_BLOCK_REASON="GitHub auto-merge request failed or repository auto-merge is not enabled."
            fi
          else
            export PRODUCT_LAB_AUTO_MERGE_STATUS="blocked"
            export PRODUCT_LAB_AUTO_MERGE_BLOCK_REASON="${{ steps.auto_merge_policy.outputs.auto_merge_block_reason }}"
          fi
          export PRODUCT_LAB_PR_STATUS="created"
          npm run product-lab:pr-status:record

      - name: Report blocked Product Lab PR
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.validation.outputs.checks_passed == 'false'
        run: |
          echo "::warning title=Product Lab PR blocked::No PR was created because smoke QA, lint, tests, or build did not pass. The report artifact explains the blocker."

      - name: Fail if Product Lab admin sync failed
        if: >
          steps.guard.outputs.run == 'true' &&
          steps.run_mode.outputs.dry_run != 'true' &&
          (
            steps.admin_sync_preflight.outputs.ready != 'true' ||
            steps.proposals_push.outcome != 'success' ||
            steps.run_status_sync.outcome != 'success'
          )
        run: |
          if [ "${{ steps.admin_sync_preflight.outputs.ready }}" != "true" ]; then
            echo "::error title=Product Lab admin sync configuration missing::Missing: ${{ steps.admin_sync_preflight.outputs.missing }}. Add the missing value in GitHub repo pixelrises/v2 > Settings > Secrets and variables > Actions."
          fi
          echo "::error title=Product Lab admin sync failed::The workflow could not push review proposals to Supabase, so the admin would not show the new suggestions."
          exit 1
